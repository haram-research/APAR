<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>APAR 정답키 작성 가이드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
    background: #f5f6fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container {
    max-width: 640px;
    width: 100%;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 0.4rem;
  }
  .subtitle {
    color: #6b7280;
    font-size: 0.95rem;
    margin-bottom: 2rem;
  }
  .slides {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  a.slide-card {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  a.slide-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border-color: #a5b4fc;
  }
  .num {
    font-size: 0.8rem;
    font-weight: 700;
    color: #6366f1;
    background: #eef2ff;
    border-radius: 8px;
    padding: 0.3rem 0.6rem;
    min-width: 2.4rem;
    text-align: center;
  }
  .slide-title {
    font-size: 1rem;
    font-weight: 600;
    color: #111827;
  }
  .arrow {
    margin-left: auto;
    color: #9ca3af;
    font-size: 1.1rem;
  }
</style>
</head>

  <div class="slides">

      <span class="slide-title">기본 형식 — [ ... ] 블록</span>
      <span class="arrow">›</span>
    </a>
    <a class="slide-card" href="Slide03.html">
      <span class="num">02</span>
      <span class="slide-title">Type A — 단답/구 정답형</span>
      <span class="arrow">›</span>
    </a>
    <a class="slide-card" href="Slide04.html">
